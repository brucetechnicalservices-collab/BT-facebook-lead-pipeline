name: BruceTech Facebook Leads

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: score records but make no Airtable writes"
        type: boolean
        default: false
        required: false
      start_new_apify_run:
        description: "Start a fresh Apify run instead of reading the last one"
        type: boolean
        default: false
        required: false
      ai_batch_limit:
        description: "Maximum records evaluated by AI this run (lower this when testing)"
        type: string
        default: "20"
        required: false
      openai_request_budget:
        description: "Maximum OpenAI API requests this run, retries included. Blank uses ai_batch_limit x OPENAI_MAX_ATTEMPTS. 0 disables the ceiling"
        type: string
        default: ""
        required: false
      apify_run_id:
        description: "Import from one exact Apify run ID (leave blank for the last successful run)"
        type: string
        default: ""
        required: false

  # SCHEDULE PAUSED.
  #
  # The daily run is disabled while the new qualification rules are being
  # validated against the production Airtable base. Trigger the pipeline
  # manually with "Run workflow" until you are satisfied with the results
  # (tick "Dry run" to score without writing).
  #
  # To re-enable, uncomment the three lines below.
  #
  # schedule:
  #   - cron: "30 6 * * *"
  #     timezone: "America/Toronto"

# Two pipeline runs must never overlap: both write to the same Airtable base
# and would double-process the queue. Queued runs wait rather than cancel, so
# an in-flight run always finishes its Airtable writes.
concurrency:
  group: facebook-leads-pipeline
  cancel-in-progress: false

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q

  run-pipeline:
    name: Run pipeline
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BruceTech lead pipeline
        env:
          # Secrets. Never hard-code these values.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Model configuration.
          OPENAI_MODEL: "gpt-5-mini"
          OPENAI_MAX_OUTPUT_TOKENS: "2500"
          OPENAI_MAX_ATTEMPTS: "3"
          OPENAI_RETRY_DELAY_SECONDS: "5"

          # Qualification thresholds.
          QUALIFICATION_THRESHOLD: "65"
          MANUAL_REVIEW_THRESHOLD: "55"
          HOT_LEAD_THRESHOLD: "80"

          # Lowered from 45. The scraper works a ~3-day window and a request
          # older than a work week has usually been answered already.
          MAX_POST_AGE_DAYS: "5"

          # Stamped on every record this release evaluates, so legacy and new
          # qualification results stay comparable. Historical records are
          # never rewritten.
          QUALIFICATION_VERSION: "facebook-v2"

          # Outreach gating. Outreach Ready is strictly narrower than
          # Qualified: see README.md.
          MIN_OUTREACH_CONFIDENCE: "0.55"
          BUSINESS_PAIN_OUTREACH_MIN_SCORE: "70"
          ALLOW_TOOL_RESEARCH_TO_AI: "true"

          # Queue behaviour.
          # Dry run makes no Airtable writes and starts no paid Apify run.
          DRY_RUN: >-
            ${{ github.event.inputs.dry_run || 'false' }}
          # Records sent to the model. NOT a cap on API requests: a record
          # can cost up to OPENAI_MAX_ATTEMPTS of them.
          AI_BATCH_LIMIT: >-
            ${{ github.event.inputs.ai_batch_limit || '20' }}

          # Actual responses.create() calls for the whole run, retries
          # included. Left blank the pipeline derives
          # AI_BATCH_LIMIT * OPENAI_MAX_ATTEMPTS, which is the true worst
          # case. Set 0 to disable the ceiling.
          OPENAI_REQUEST_BUDGET: >-
            ${{ github.event.inputs.openai_request_budget || '' }}
          MAX_POST_CHARS: "8000"
          AIRTABLE_FORMULA_WAIT_SECONDS: "15"
          ENFORCE_PYTHON_PREFILTER: "true"
          PREFILTER_PASS_SCORE: "30"
          REQUIRE_AIRTABLE_PREQUALIFICATION: "false"

          # Bounded AI error recovery. A transient failure is retried on a
          # later run; three failures retire the record from the queue.
          RETRY_AI_ERRORS: "true"
          AI_ERROR_MAX_ATTEMPTS: "3"

          # Apify run attribution. Every imported post is tied to one exact
          # run, which is logged to Facebook Post Scraper Runs.
          RUN_APIFY_TASK: >-
            ${{ github.event.inputs.start_new_apify_run || 'false' }}
          APIFY_RUN_ID: >-
            ${{ github.event.inputs.apify_run_id || '' }}
          APIFY_RUN_TIMEOUT_SECONDS: "900"
          APIFY_POLL_INTERVAL_SECONDS: "15"
          LOG_SCRAPER_RUNS: "true"

          # Feedback loop.
          UPDATE_GROUP_PERFORMANCE: "true"
          AIRTABLE_SCRAPER_RUNS_TABLE: "Facebook Post Scraper Runs"
          AIRTABLE_GROUP_PERFORMANCE_TABLE: "Facebook Group Performance"
        run: python run_pipeline.py
