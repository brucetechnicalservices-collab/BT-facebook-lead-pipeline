name: BruceTech Facebook Leads

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: score records but make no Airtable writes"
        type: boolean
        default: false
        required: false
      start_new_apify_run:
        description: "Start a fresh Apify run instead of reading the last one"
        type: boolean
        default: false
        required: false
      ai_batch_limit:
        description: "Max AI calls this run (lower this when testing)"
        type: string
        default: "40"
        required: false
      apify_run_id:
        description: "Import from one exact Apify run ID (leave blank for the last successful run)"
        type: string
        default: ""
        required: false

  # SCHEDULE PAUSED.
  #
  # The daily run is disabled while the new qualification rules are being
  # validated against the production Airtable base. Trigger the pipeline
  # manually with "Run workflow" until you are satisfied with the results
  # (tick "Dry run" to score without writing).
  #
  # To re-enable, uncomment the three lines below.
  #
  # schedule:
  #   - cron: "30 6 * * *"
  #     timezone: "America/Toronto"

# Two pipeline runs must never overlap: both write to the same Airtable base
# and would double-process the queue. Queued runs wait rather than cancel, so
# an in-flight run always finishes its Airtable writes.
concurrency:
  group: facebook-leads-pipeline
  cancel-in-progress: false

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q

  run-pipeline:
    name: Run pipeline
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ==================================================================
      # TEMPORARY: Suggested Comment OpenAI smoke test.
      #
      # This step replaces the production pipeline run for one manual
      # execution. It calls scripts/suggested_comment_smoke_test.py, which
      # exercises run_pipeline.qualify_post against five in-memory records.
      #
      # OpenAI is the ONLY external service reachable here. Every Airtable
      # and Apify credential is deliberately blank, so any accidental call
      # would fail loudly rather than touch production data.
      #
      # REVERT THIS STEP after the smoke test log is captured.
      # ==================================================================
      - name: Suggested Comment OpenAI smoke test (TEMPORARY)
        env:
          # The only credential this step is given.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Deliberately blank. Nothing here may reach Airtable or Apify.
          AIRTABLE_TOKEN: ""
          AIRTABLE_BASE_ID: ""
          AIRTABLE_TABLE_NAME: ""
          APIFY_TOKEN: ""
          APIFY_TASK_ID: ""
          RUN_APIFY_TASK: "false"
          DRY_RUN: "true"

          # Production model and qualification settings, so the smoke test
          # exercises exactly what production would.
          OPENAI_MODEL: "gpt-5-mini"
          OPENAI_MAX_OUTPUT_TOKENS: "2500"
          OPENAI_MAX_ATTEMPTS: "3"
          OPENAI_RETRY_DELAY_SECONDS: "5"
          QUALIFICATION_THRESHOLD: "65"
          MANUAL_REVIEW_THRESHOLD: "55"
          HOT_LEAD_THRESHOLD: "80"
          MAX_POST_AGE_DAYS: "5"
          QUALIFICATION_VERSION: "facebook-v2"
          MIN_OUTREACH_CONFIDENCE: "0.55"
          BUSINESS_PAIN_OUTREACH_MIN_SCORE: "70"
          ALLOW_TOOL_RESEARCH_TO_AI: "true"
          MAX_POST_CHARS: "8000"
          ENFORCE_PYTHON_PREFILTER: "true"
          PREFILTER_PASS_SCORE: "30"
        run: python scripts/smoke_suggested_comment.py
